<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jurassic Park Valley</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #101712; }
    body { font-family: system-ui, sans-serif; color: #d6dfcf; }
    canvas { display: block; width: 100%; height: 100%; }
    #hint { position: fixed; left: 18px; bottom: 16px; padding: 8px 11px; border: 1px solid #ffffff1f; background: #0d1710b8; border-radius: 5px; font-size: 12px; letter-spacing: .03em; pointer-events: none; }
    #stats { position: fixed; right: 14px; top: 14px; min-width: 168px; padding: 10px; color: #d7e7cf; background: #0d1710c4; border: 1px solid #ffffff20; border-radius: 5px; font: 11px/1.5 ui-monospace, monospace; white-space: pre; display: none; pointer-events: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hint">Click to explore · WASD move · Shift sprint · Space jump · F free-fly · F3 stats</div>
  <div id="stats"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
